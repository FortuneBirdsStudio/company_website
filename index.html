<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>Fortune Birds Studio</title>
</head>
<body>

    <!-- 1. 保证页面主内容正常存在（不要加 display:none） -->
    <header>
        <h1>Fortune Birds Studio</h1>
    </header>

    <main>
        <section>
            <h2>Welcome to Fortune Birds Studio</h2>
            <p>Our company introduction and content goes here...</p>
        </section>
    </main>

    <!-- 2. Cookie 弹窗（仅弹窗默认隐藏或显示，绝对不要把上面的 main 给隐藏了） -->
    <div id="cookie-banner" style="position: fixed; bottom: 0; left: 0; right: 0; background: #222; color: #fff; padding: 15px; text-align: center; z-index: 9999;">
        <p>We use cookies to analyze our website traffic.</p>
        <button id="cookie-accept">Accept All</button>
        <button id="cookie-reject">Reject Non-Essential</button>
    </div>

    <!-- 3. Cookie 控制脚本 -->
    <script>
      // 脚本逻辑仅针对 cookie-banner 的显示与隐藏，切勿隐藏 body 或 main
      const consent = localStorage.getItem('cookieConsent');
      const banner = document.getElementById('cookie-banner');
      
      if (consent) {
        banner.style.display = 'none'; // 已选择过则隐藏弹窗
      }
      
      document.getElementById('cookie-accept').addEventListener('click', function() {
        localStorage.setItem('cookieConsent', 'granted');
        banner.style.display = 'none';
      });
      document.getElementById('cookie-reject').addEventListener('click', function() {
        localStorage.setItem('cookieConsent', 'denied');
        banner.style.display = 'none';
      });
    </script>

</body>
</html>
